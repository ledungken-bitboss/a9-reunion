<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Video động kỷ niệm 20 năm A9">
  <defs>
    <linearGradient id="filmBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8ea"/>
      <stop offset=".55" stop-color="#d7a84f"/>
      <stop offset="1" stop-color="#7d1613"/>
    </linearGradient>
    <style>
      .fade1{animation:f1 12s infinite}.fade2{animation:f2 12s infinite}.fade3{animation:f3 12s infinite}
      .petal{animation:fall 8s linear infinite}.petal:nth-child(2){animation-delay:1.4s}.petal:nth-child(3){animation-delay:2.8s}.petal:nth-child(4){animation-delay:4.2s}
      @keyframes f1{0%,28%{opacity:1}36%,100%{opacity:0}}
      @keyframes f2{0%,30%{opacity:0}38%,62%{opacity:1}70%,100%{opacity:0}}
      @keyframes f3{0%,64%{opacity:0}72%,100%{opacity:1}}
      @keyframes fall{from{transform:translateY(-80px) rotate(0)}to{transform:translateY(820px) rotate(280deg)}}
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#filmBg)"/>
  <g class="fade1">
    <text x="640" y="286" text-anchor="middle" fill="#7d1613" font-family="Georgia,serif" font-size="98" font-weight="700">A9</text>
